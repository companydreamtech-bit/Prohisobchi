<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Asosiy fon gradienti -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041811" />
      <stop offset="50%" stop-color="#062419" />
      <stop offset="100%" stop-color="#0A3324" />
    </linearGradient>

    <!-- Neon yashil gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Nozik shaffof panel gradienti -->
    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>

    <!-- Neon nurlanish filtri (Glow) -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Orqa fon squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Nozik koordinata fon chiziqlari (Minimal grid) -->
  <line x1="80" y1="170" x2="432" y2="170" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4" />
  <line x1="165" y1="80" x2="165" y2="390" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4" />
  <line x1="347" y1="80" x2="347" y2="390" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- ASOSIY KONTUR: Rom / Konstruksiya ramkasi -->
  <rect x="116" y="80" width="280" height="296" rx="28" fill="none" stroke="url(#neonGreen)" stroke-width="9" />

  <!-- Ichki vertikal ajratuvchi profil -->
  <line x1="256" y1="84" x2="256" y2="372" stroke="url(#neonGreen)" stroke-width="4.5" stroke-opacity="0.8" />

  <!-- Chap yuqori: Oyna shisha paneli (Glass) -->
  <rect x="134" y="98" width="104" height="126" rx="12" fill="url(#glassPanel)" />

  <!-- Chap pastki: O'lchov chizg'ichi (Precision Ruler) -->
  <path d="M 152 270 L 152 350 L 232 350" fill="none" stroke="url(#neonGreen)" stroke-width="5" stroke-linecap="round" />
  <line x1="152" y1="290" x2="168" y2="290" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round" />
  <line x1="152" y1="310" x2="174" y2="310" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round" />
  <line x1="152" y1="330" x2="168" y2="330" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round" />
  <line x1="172" y1="350" x2="172" y2="334" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round" />
  <line x1="192" y1="350" x2="192" y2="328" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round" />
  <line x1="212" y1="350" x2="212" y2="334" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round" />

  <!-- O'ng yuqori: Hisob-kitob / Modul satrlari (ERP satrlari) -->
  <rect x="278" y="112" width="98" height="12" rx="6" fill="#10B981" />
  <rect x="278" y="136" width="98" height="12" rx="6" fill="#10B981" fill-opacity="0.85" />
  <rect x="278" y="160" width="98" height="12" rx="6" fill="#10B981" fill-opacity="0.7" />
  <rect x="278" y="184" width="98" height="12" rx="6" fill="#10B981" fill-opacity="0.55" />
  <rect x="278" y="208" width="98" height="12" rx="6" fill="#10B981" fill-opacity="0.4" />

  <!-- O'ng pastki: Glowing Neon "P" belgisi (ERP tugmasi) -->
  <rect x="282" y="260" width="88" height="88" rx="24" fill="#10B981" filter="url(#neonGlow)" />
  <text x="326" y="324" fill="#062419" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="52" text-anchor="middle">P</text>

  <!-- PASTKI MATNLAR -->
  <text x="256" y="438" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="9" text-anchor="middle">PRO HISOBCHI</text>
  <text x="256" y="472" fill="#10B981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="5" text-anchor="middle">USTAXONA ERP TIZIMI</text>
</svg>
